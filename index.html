<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lễ Dạm Ngõ - Cao Bằng & Thanh Thúy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400&display=swap" rel="stylesheet">

    <style>
        /* Typography */
        .font-playfair { font-family: 'Playfair Display', serif; }
        .font-cursive { font-family: 'Great Vibes', cursive; }
        .font-sans { font-family: 'Inter', sans-serif; }

        /* Custom Colors */
        .text-maroon { color: #8e3a46; }
        
        body {
            background-color: #fdf5f6; /* Soft pastel pink base */
            overflow: hidden; /* Ngăn thanh cuộn trên TV */
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }

        /* Hiệu ứng rơi */
        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: var(--target-opacity, 0.4);
            }
            80% {
                opacity: var(--target-opacity, 0.4);
            }
            100% {
                transform: translateY(110vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        .chu-hi {
            position: absolute;
            top: -10vh;
            user-select: none;
            pointer-events: none;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: 1;
            animation-fill-mode: forwards;
            text-shadow: 0 1px 2px rgba(255, 182, 193, 0.3);
            z-index: 20;
        }

        /* Khung Slide */
        .slide {
            transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out;
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .slide-active {
            opacity: 1;
            transform: scale(1);
            z-index: 10;
            pointer-events: auto;
        }
        
        .slide-inactive {
            opacity: 0;
            transform: scale(0.98);
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="relative w-full h-full selection:bg-pink-300 selection:text-white">

    <!-- Nền màu loang -->
    <div class="absolute top-0 left-0 w-[50vw] h-[50vw] bg-pink-200 rounded-full blur-[100px] opacity-60 -translate-x-1/4 -translate-y-1/4 z-0 pointer-events-none"></div>
    <div class="absolute bottom-0 right-0 w-[60vw] h-[60vw] bg-rose-200 rounded-full blur-[120px] opacity-50 translate-x-1/4 translate-y-1/4 z-0 pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 w-[40vw] h-[40vw] bg-red-100 rounded-full blur-[100px] opacity-40 -translate-x-1/2 -translate-y-1/2 z-0 pointer-events-none"></div>

    <!-- Chữ 囍 lớn chìm dưới nền -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0 overflow-hidden">
        <span class="font-playfair text-[50vh] text-rose-300 opacity-[0.15] select-none leading-none">囍</span>
    </div>

    <!-- Nơi chứa hiệu ứng chữ rơi -->
    <div id="falling-container" class="absolute inset-0 pointer-events-none z-20 overflow-hidden"></div>

    <!-- Hoa đào trang trí góc trên phải -->
    <div class="absolute top-0 right-0 p-[2vw] z-10 pointer-events-none opacity-85 w-[20vw] h-[20vw] max-w-[250px] max-h-[250px] origin-top-right">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
            <g fill="#ffb6c1">
                <path d="M150 40 C 160 20, 180 30, 175 50 C 195 45, 200 65, 180 75 C 190 95, 170 100, 155 85 C 145 105, 125 95, 135 75 C 115 65, 125 45, 145 50 Z" />
                <circle cx="160" cy="65" r="5" fill="#f06292" opacity="0.6"/>
                <path d="M110 20 C 115 10, 125 15, 120 25 C 130 20, 135 30, 125 35 C 130 45, 120 50, 115 40 C 110 50, 100 45, 105 35 C 95 30, 100 20, 110 25 Z" fill="#ffc0cb"/>
                <path d="M180 110 C 185 100, 195 105, 190 115 C 200 110, 205 120, 195 125 C 200 135, 190 140, 185 130 C 180 140, 170 135, 175 125 C 165 120, 170 110, 180 115 Z" fill="#ff9aa2"/>
                <path d="M140 110 C 145 108, 148 112, 145 115 C 142 118, 138 115, 140 110 Z" fill="#ffb6c1"/>
                <path d="M90 60 C 93 58, 96 61, 94 64 C 91 66, 88 64, 90 60 Z" fill="#ffc0cb"/>
            </g>
        </svg>
    </div>

    <!-- Hoa đào trang trí góc dưới trái -->
    <div class="absolute bottom-0 left-0 p-[2vw] z-10 pointer-events-none opacity-85 w-[20vw] h-[20vw] max-w-[250px] max-h-[250px] origin-bottom-left">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
            <g fill="#ffb6c1">
                <path d="M50 140 C 60 120, 80 130, 75 150 C 95 145, 100 165, 80 175 C 90 195, 70 200, 55 185 C 45 205, 25 195, 35 175 C 15 165, 25 145, 45 150 Z" />
                <circle cx="60" cy="165" r="4" fill="#f06292" opacity="0.6"/>
                <path d="M90 120 C 95 110, 105 115, 100 125 C 110 120, 115 130, 105 135 C 110 145, 100 150, 95 140 C 90 150, 80 145, 85 135 C 75 130, 80 120, 90 125 Z" fill="#ff9aa2"/>
                <path d="M110 170 C 113 168, 116 172, 114 175 C 111 178, 108 175, 110 170 Z" fill="#ffc0cb"/>
                <path d="M30 115 C 33 113, 36 116, 34 119 C 31 122, 28 119, 30 115 Z" fill="#ffb6c1"/>
            </g>
        </svg>
    </div>

    <!-- Khung chứa Nội dung -->
    <div id="slides-container" class="relative w-full h-full z-10 flex items-center justify-center">
        
        <!-- TRANG 1: Tên và Ngày tháng -->
        <div class="slide slide-active w-full" id="slide-1">
            <h1 class="font-playfair text-[6vh] text-maroon font-semibold tracking-wide mb-[4vh]">
                Lễ Dạm Ngõ
            </h1>
            
            <!-- Đã sửa lại khối hiển thị tên: dùng transform để lệch vị trí, thêm whitespace-nowrap để cấm rớt dòng -->
            <div class="w-full flex flex-col items-center justify-center font-cursive text-maroon text-[15vh] leading-none whitespace-nowrap">
                
                <!-- Kéo Cao Bằng sang trái bằng transform -->
                <div class="transform -translate-x-[12vw] mb-[3vh]">
                    Cao Bằng
                </div>
                
                <div class="text-[10vh] opacity-80 my-[3vh]">
                    &
                </div>
                
                <!-- Kéo Thanh Thúy sang phải bằng transform -->
                <div class="transform translate-x-[12vw] mt-[3vh]">
                    Thanh Thúy
                </div>

            </div>

            <div class="mt-[6vh] text-center text-maroon opacity-80 font-sans tracking-widest leading-relaxed">
                <p class="text-[3vh]">29.09.2026</p>
                <p class="text-[2.5vh]">(19.08 Bính Ngọ)</p>
            </div>
        </div>

        <!-- TRANG 2: Lời cảm ơn -->
        <div class="slide slide-inactive w-full" id="slide-2">
            <h1 class="font-playfair text-[6vh] text-maroon font-semibold tracking-wide mb-[8vh]">
                Lễ Dạm Ngõ
            </h1>

            <div class="relative w-[70vw] text-center font-cursive text-[7.5vh] text-maroon leading-[1.7]">
                
                <div class="absolute -top-[4vh] -left-[2vw] opacity-80">
                    <svg viewBox="0 0 24 24" fill="#ff9aa2" xmlns="http://www.w3.org/2000/svg" class="w-[8vh] h-[8vh] -rotate-12">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        <path d="M6 7 C 8 4, 10 9, 12 6" stroke="#fff" stroke-width="0.5" fill="none" opacity="0.6"/>
                    </svg>
                </div>

                <p>
                    Chúng con xin cảm ơn sự yêu thương của hai bên gia đình và tình cảm quý báu của cả nhà đã góp mặt trong ngày đặc biệt này.
                </p>

                <div class="absolute -bottom-[4vh] -right-[2vw] opacity-80">
                    <svg viewBox="0 0 24 24" fill="#ff8a98" xmlns="http://www.w3.org/2000/svg" class="w-[6vh] h-[6vh] rotate-12">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        <path d="M16 6 C 18 8, 14 12, 17 14" stroke="#fff" stroke-width="0.8" fill="none" opacity="0.6"/>
                    </svg>
                </div>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const slides = [
                document.getElementById('slide-1'), 
                document.getElementById('slide-2')  
            ];
            
            const slideDurations = [8000, 5000]; 
            let currentSlideIndex = 0;

            function showNextSlide() {
                slides[currentSlideIndex].classList.remove('slide-active');
                slides[currentSlideIndex].classList.add('slide-inactive');
                
                currentSlideIndex = (currentSlideIndex + 1) % slides.length;
                
                slides[currentSlideIndex].classList.remove('slide-inactive');
                slides[currentSlideIndex].classList.add('slide-active');

                setTimeout(showNextSlide, slideDurations[currentSlideIndex]);
            }

            setTimeout(showNextSlide, slideDurations[0]);

            const fallingContainer = document.getElementById('falling-container');
            const colors = ['#e57373', '#ef5350', '#f48fb1', '#ff8a80', '#ff5252', '#f8bbd0'];

            function spawnChuHi() {
                const element = document.createElement('span');
                element.classList.add('chu-hi');
                element.innerText = '囍';

                const startPosX = Math.random() * 100;
                const duration = Math.random() * 8 + 10; 
                const size = Math.random() * 2 + 1; 
                const opacity = Math.random() * 0.3 + 0.15;
                const color = colors[Math.floor(Math.random() * colors.length)];

                element.style.left = `${startPosX}vw`;
                element.style.animationDuration = `${duration}s`;
                element.style.fontSize = `${size}vw`;
                element.style.color = color;
                element.style.setProperty('--target-opacity', opacity.toString());

                fallingContainer.appendChild(element);

                setTimeout(() => {
                    if (element.parentNode === fallingContainer) {
                        element.remove();
                    }
                }, (duration * 1000) + 100);
            }

            for(let i = 0; i < 8; i++) {
                setTimeout(spawnChuHi, Math.random() * 4000);
            }

            setInterval(spawnChuHi, 800);
        });
    </script>
</body>
</html>
