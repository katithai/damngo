<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lễ Dạm Ngõ - Cao Bằng & Thanh Thủy</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

    <style>
        /* Typography assignments */
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-cursive { font-family: 'Dancing Script', cursive; }
        .font-sans { font-family: 'Inter', sans-serif; }

        body {
            /* Soft pastel pink gradient background */
            background: radial-gradient(circle at center, #fff0f5 0%, #fce4ec 100%);
            overflow: hidden; /* Crucial for TV display: no scrollbars */
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }

        /* Smooth slide transitions */
        .slide {
            transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out;
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
        }
        
        .slide.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            z-index: 20;
        }

        /* Falling Animation for 囍 */
        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            15% {
                opacity: var(--max-opacity, 0.4);
            }
            85% {
                opacity: var(--max-opacity, 0.4);
            }
            100% {
                transform: translateY(110vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        .falling-hi {
            position: absolute;
            top: -10vh;
            user-select: none;
            pointer-events: none;
            animation-name: fall;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
            text-shadow: 0 2px 4px rgba(255, 182, 193, 0.2);
            z-index: 15;
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>

<body class="relative w-full h-screen selection:bg-pink-300 selection:text-white flex items-center justify-center">

    <!-- Center Watermark '囍' (Huge, centered, very low opacity) -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
        <span class="font-serif text-[60vh] text-[#e98ea4] opacity-[0.1] select-none leading-none">囍</span>
    </div>

    <!-- Cherry Blossom Decorations tailored for TV aspect ratio -->
    <!-- Top Right Flower Branch -->
    <div class="absolute top-0 right-0 z-10 pointer-events-none opacity-90 w-[35vh] h-[35vh] origin-top-right transform translate-x-[2vh] -translate-y-[2vh]">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-sm">
            <g fill="#ffb6c1">
                <!-- Large flower -->
                <path d="M150 40 C 160 20, 180 30, 175 50 C 195 45, 200 65, 180 75 C 190 95, 170 100, 155 85 C 145 105, 125 95, 135 75 C 115 65, 125 45, 145 50 Z" />
                <circle cx="160" cy="65" r="5" fill="#f06292" opacity="0.8"/>
                <!-- Medium flower -->
                <path d="M110 20 C 115 10, 125 15, 120 25 C 130 20, 135 30, 125 35 C 130 45, 120 50, 115 40 C 110 50, 100 45, 105 35 C 95 30, 100 20, 110 25 Z" fill="#ffc0cb"/>
                <!-- Small flower & Petals -->
                <path d="M180 110 C 185 100, 195 105, 190 115 C 200 110, 205 120, 195 125 C 200 135, 190 140, 185 130 C 180 140, 170 135, 175 125 C 165 120, 170 110, 180 115 Z" fill="#ff9aa2"/>
                <path d="M140 110 C 145 108, 148 112, 145 115 C 142 118, 138 115, 140 110 Z" fill="#ffb6c1"/>
                <path d="M90 60 C 93 58, 96 61, 94 64 C 91 66, 88 64, 90 60 Z" fill="#ffc0cb"/>
            </g>
        </svg>
    </div>

    <!-- Bottom Left Flower Branch -->
    <div class="absolute bottom-0 left-0 z-10 pointer-events-none opacity-90 w-[35vh] h-[35vh] origin-bottom-left transform -translate-x-[2vh] translate-y-[2vh]">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-sm">
            <g fill="#ffb6c1">
                <path d="M50 140 C 60 120, 80 130, 75 150 C 95 145, 100 165, 80 175 C 90 195, 70 200, 55 185 C 45 205, 25 195, 35 175 C 15 165, 25 145, 45 150 Z" />
                <circle cx="60" cy="165" r="4" fill="#f06292" opacity="0.8"/>
                <path d="M90 120 C 95 110, 105 115, 100 125 C 110 120, 115 130, 105 135 C 110 145, 100 150, 95 140 C 90 150, 80 145, 85 135 C 75 130, 80 120, 90 125 Z" fill="#ff9aa2"/>
                <path d="M110 170 C 113 168, 116 172, 114 175 C 111 178, 108 175, 110 170 Z" fill="#ffc0cb"/>
                <path d="M30 115 C 33 113, 36 116, 34 119 C 31 122, 28 119, 30 115 Z" fill="#ffb6c1"/>
            </g>
        </svg>
    </div>

    <!-- Container for falling elements -->
    <div id="falling-container" class="absolute inset-0 pointer-events-none z-15 overflow-hidden w-full h-full"></div>

    <div id="slides-wrapper" class="relative w-full h-full flex items-center justify-center z-20">
        
        <!-- SLIDE 1: Title, Names, Date -->
        <div class="slide active" id="slide-1">
            
            <!-- Title -->
            <h1 class="font-serif text-[5.5vh] text-[#902b3a] font-bold tracking-[0.2em] uppercase mb-[6vh] drop-shadow-sm">
                Lễ Dạm Ngõ
            </h1>
            
            <!-- Names Block: Engineered for perfect centering on 16:9 -->
            <div class="w-[65vw] flex flex-col items-center justify-center font-cursive text-[#b33959] drop-shadow-md">
                <!-- Groom (Top Left Offset) -->
                <div class="w-full text-center text-[15vh] pr-[24vw] leading-none">
                    Cao Bằng
                </div>
                
                <!-- Ampersand (Dead Center) -->
                <div style="margin: 25px;" class="text-[9vh] text-[#d1758c] my-[-3vh] z-10 leading-none">
                    &
                </div>
                
                <!-- Bride (Bottom Right Offset) -->
                <div class="w-full text-center text-[15vh] pl-[24vw] leading-none">
                    Thanh Thúy
                </div>
            </div>

            <!-- Date -->
            <div class="mt-[10vh] text-center text-[#8c5d6b] font-sans opacity-85 tracking-widest leading-relaxed">
                <p class="text-[3.5vh] font-medium mb-[0.5vh]">29.09.2026</p>
                <p class="text-[2.5vh]">(19.08 Bính Ngọ)</p>
            </div>
            
        </div>

        <!-- SLIDE 2: Thank You Message -->
        <div class="slide" id="slide-2">
            
            <!-- Title -->
            <h1 class="font-serif text-[5.5vh] text-[#902b3a] font-bold tracking-[0.2em] uppercase mb-[8vh] drop-shadow-sm">
                Lễ Dạm Ngõ
            </h1>

            <!-- Message Block -->
            <div class="relative w-[75vw] max-w-[1400px] text-center">
                
                <!-- Top Left Heart Decoration -->
                <div class="absolute -top-[6vh] left-[2vw] text-[#ff9aa2] opacity-80 w-[7vh] h-[7vh] transform -rotate-12">
                    <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-sm">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        <path d="M6 7 C 8 4, 10 9, 12 6" stroke="#fff" stroke-width="0.5" fill="none" opacity="0.6"/>
                    </svg>
                </div>

                <!-- Thank You Text -->
                <p class="font-cursive text-[7.5vh] text-[#9c2e4d] leading-[1.65] drop-shadow-sm px-[4vw]">
                    Chúng con xin cảm ơn sự yêu thương của hai bên gia đình và tình cảm quý báu của cả nhà đã góp mặt trong ngày đặc biệt này.
                </p>

                <!-- Bottom Right Heart Decoration -->
                <div class="absolute -bottom-[5vh] right-[2vw] text-[#ff8a98] opacity-80 w-[6vh] h-[6vh] transform rotate-12">
                    <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-sm">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        <path d="M16 6 C 18 8, 14 12, 17 14" stroke="#fff" stroke-width="0.8" fill="none" opacity="0.6"/>
                    </svg>
                </div>
                
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            /* --- SLIDESHOW LOGIC --- */
            const slides = [
                document.getElementById('slide-1'),
                document.getElementById('slide-2')
            ];
            let currentSlideIndex = 0;

            // Define custom durations for each slide (in milliseconds)
            // Slide 1 (Names): 8000ms (8 seconds)
            // Slide 2 (Thank You): 5000ms (5 seconds)
            const slideDurations = [15000, 5000]; 

            function switchSlide() {
                // Fade out current slide
                slides[currentSlideIndex].classList.remove('active');
                
                // Advance to the next slide index
                currentSlideIndex = (currentSlideIndex + 1) % slides.length;
                
                // Fade in the new slide
                slides[currentSlideIndex].classList.add('active');
                
                // Schedule the next transition based on the new slide's duration
                setTimeout(switchSlide, slideDurations[currentSlideIndex]);
            }

            // Start the initial timer using Slide 1's duration
            setTimeout(switchSlide, slideDurations[0]);


            /* --- FALLING '囍' LOGIC --- */
            const fallingContainer = document.getElementById('falling-container');
            // Array of soft, elegant pink/red colors
            const colors = ['#e57373', '#ef5350', '#f48fb1', '#ff8a80', '#ff5252', '#f8bbd0'];

            function spawnChuHi() {
                const element = document.createElement('span');
                element.classList.add('falling-hi');
                element.innerText = '囍';

                // Randomize position across the entire viewport width (0vw to 100vw)
                const startPosX = Math.random() * 100;
                
                // Randomize speed for TV (slower is more elegant, between 10s and 18s)
                const duration = Math.random() * 8 + 10;
                
                // Randomize size relative to viewport height (between 3vh and 5.5vh)
                const size = Math.random() * 2.5 + 3;
                
                // Opacity
                const maxOpacity = Math.random() * 0.3 + 0.15;
                const color = colors[Math.floor(Math.random() * colors.length)];

                element.style.left = `${startPosX}vw`;
                element.style.animationDuration = `${duration}s`;
                element.style.fontSize = `${size}vh`;
                element.style.color = color;
                element.style.setProperty('--max-opacity', maxOpacity.toString());

                fallingContainer.appendChild(element);

                // Clean up DOM to prevent lag on smart TVs
                setTimeout(() => {
                    if (element.parentNode === fallingContainer) {
                        element.remove();
                    }
                }, (duration * 1000) + 100);
            }

            // Initial burst to quickly populate screen on load
            for(let i = 0; i < 8; i++) {
                setTimeout(spawnChuHi, Math.random() * 2000);
            }

            // Spawn new element every 900ms
            setInterval(spawnChuHi, 900);
        });
    </script>
</body>
</html>
